<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slop Scan</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1d1f; --muted: #6b6e75; --line: #e4e4e0;
    --accent: #3b5bdb; --chip: #eef0f3;
    --critical: #c92a2a; --high: #e8590c; --medium: #d9a300; --low: #6c8ebf;
    --good: #2b8a3e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517; --panel: #1c1d20; --ink: #e8e8e6; --muted: #9a9ca3; --line: #2e3035;
      --accent: #7b93f5; --chip: #26282c;
      --critical: #ff6b6b; --high: #ff922b; --medium: #f5c542; --low: #8fb0e0;
      --good: #51cf66;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 40px 0 12px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }

  header { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .grade { width: 76px; height: 76px; border-radius: 14px; display: grid; place-items: center;
           font-size: 40px; font-weight: 700; color: #fff; flex: none; }
  .grade.A { background: var(--good); } .grade.B { background: #5c940d; } .grade.C { background: var(--medium); }
  .grade.D { background: var(--high); } .grade.F { background: var(--critical); }
  .headline { flex: 1; min-width: 240px; }
  .headline p { margin: 4px 0 0; }
  .warning { margin-top: 20px; padding: 12px 16px; border-left: 4px solid var(--high); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .tile { padding: 14px 16px; }
  .tile .value { font-size: 26px; font-weight: 650; }
  .tile .label { color: var(--muted); font-size: 12px; }
  .tile.sev { border-top: 3px solid var(--c); }

  .summary { padding: 18px 20px; }
  .themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .theme { padding: 14px 16px; }
  .theme strong { display: block; margin-bottom: 4px; }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
  .bars { padding: 14px 16px; }
  .bar-row { display: grid; grid-template-columns: 110px 1fr 56px; gap: 10px; align-items: center; padding: 4px 0; }
  .bar-track { height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 5px; }
  .bar-row .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--chip); }
  .pill.sloppy, .pill.low-c { color: var(--critical); } .pill.concerning { color: var(--high); }
  .pill.minor { color: var(--medium); } .pill.clean { color: var(--good); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .filters input[type=search], .filters select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
       background: var(--panel); color: var(--ink); font: inherit; }
  .filters input[type=search] { flex: 1; min-width: 200px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
          padding: 5px 12px; cursor: pointer; font: inherit; }
  .chip[aria-pressed=true] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .count { margin-left: auto; }

  .finding { margin-bottom: 8px; border-left: 4px solid var(--c); }
  .finding summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; gap: 4px; }
  .finding summary::-webkit-details-marker { display: none; }
  .finding .title { font-weight: 600; }
  .finding .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 12.5px; }
  .finding .sev { color: var(--c); font-weight: 700; text-transform: uppercase; font-size: 11.5px; letter-spacing: 0.05em; }
  .finding .body { padding: 0 16px 14px; display: grid; gap: 8px; }
  .finding .body p { margin: 0; }
  .finding .body b { display: inline-block; min-width: 76px; color: var(--muted); font-weight: 600; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .priorities { margin: 0; padding: 14px 16px 14px 40px; display: grid; gap: 10px; }
  .priorities a { color: var(--ink); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--line); }
  .sevtag { color: var(--c); font-weight: 700; text-transform: uppercase; font-size: 11.5px; letter-spacing: 0.05em; margin-left: 6px; }
  .dismissed { padding: 12px 16px; } .dismissed summary { cursor: pointer; }
  .dismissed ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 8px; }
  .footer { margin-top: 32px; font-size: 12px; }
  .reasons { margin: 6px 0 0; font-size: 13px; }
  .flow { padding: 14px 16px; margin-bottom: 10px; }
  .flow ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; }
  td.flag { font-weight: 700; color: var(--high); }
  .note { padding: 10px 16px 0; margin: 0; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = /*__SLOP_DATA__*/null;
const SEVERITIES = ["critical", "high", "medium", "low"];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const where = (l) => l.start_line ? `${l.path}:${l.start_line}${l.end_line && l.end_line !== l.start_line ? "-" + l.end_line : ""}` : l.path;
const fmt = (n) => Number(n).toLocaleString();

function render() {
  const { meta, score } = DATA;
  document.title = `Slop Scan: ${meta.name}`;
  const gaps = Object.entries(DATA.coverage).filter(([, c]) => c.done < c.tasks);
  const app = document.getElementById("app");
  app.innerHTML = `
    <header>
      <div class="grade ${esc(score.grade)}">${esc(score.grade)}</div>
      <div class="headline">
        <h1>${esc(meta.name)}</h1>
        <p class="muted">Slop index <strong>${score.slop_index}</strong> weighted findings per 1k LOC ·
          <strong>${score.duplication_pct ?? 0}%</strong> copied code ·
          ${fmt(score.files_scanned)} files · ${fmt(score.total_loc)} LOC · scanned ${esc(meta.scanned.slice(0, 10))}</p>
        ${(score.grade_reasons || []).length ? `<p class="reasons">Grade set by: ${score.grade_reasons.map(esc).join("; ")}</p>` : ""}
        <p class="muted">History: ${esc(historyLabel(meta.history))}</p>
        <p class="muted mono">${esc(meta.root)}</p>
      </div>
    </header>
    ${gaps.length ? `<div class="panel warning"><strong>Partial scan.</strong> Some worker tasks produced no valid output
      (${gaps.map(([t, c]) => `${esc(t)} ${c.done}/${c.tasks}`).join(", ")}). Scores undercount.</div>` : ""}

    <h2>Severity</h2>
    <div class="tiles">
      ${SEVERITIES.map((s) => `<div class="panel tile sev" style="--c: var(--${s})">
        <div class="value">${score.by_severity[s]}</div><div class="label">${s}</div></div>`).join("")}
      <div class="panel tile"><div class="value">${DATA.findings.length}</div><div class="label">findings kept</div></div>
      <div class="panel tile"><div class="value">${DATA.dismissed.length}</div><div class="label">dismissed as not worth fixing</div></div>
    </div>

    ${DATA.executive_summary ? `<h2>Summary</h2><div class="panel summary">${esc(DATA.executive_summary)}</div>` : ""}
    ${DATA.priorities.length ? `<h2>Fix first</h2><ol class="panel priorities">${DATA.priorities.map((p) =>
      `<li><a href="#${esc(p.id)}" data-jump="${esc(p.id)}">${esc(p.title)}</a>
        <span class="muted mono">${esc(where(p.locations[0]))}</span>
        <span class="sevtag" style="--c: var(--${p.severity})">${p.severity}</span> <span class="muted">effort ${esc(p.effort)}</span>
        <div class="muted">${esc(p.why)}</div></li>`).join("")}</ol>` : ""}
    ${DATA.themes.length ? `<h2>Themes</h2><div class="themes">${DATA.themes.map((t) =>
      `<div class="panel theme"><strong>${esc(t.title)}</strong><span class="muted">${esc(t.description)}</span></div>`).join("")}</div>` : ""}
    ${DATA.architecture_summary ? `<h2>Architecture</h2><div class="panel summary">${esc(DATA.architecture_summary)}</div>` : ""}
    ${(DATA.flows || []).length ? `<h2>Critical flows</h2>${DATA.flows.map((f) => `<div class="panel flow">
      <strong>${esc(f.name)}</strong> <span class="pill ${esc(f.health)}">${esc(f.health)}</span>
      <p>${esc(f.summary)}</p><p class="muted"><b>Ownership:</b> ${esc(f.ownership)}</p>
      <ol>${f.steps.map((s) => `<li class="mono">${esc(s)}</li>`).join("")}</ol></div>`).join("")}` : ""}
    ${DATA.fingerprint ? fingerprintSection(DATA.fingerprint) : ""}
    ${DATA.duplication && (DATA.duplication.parallel_trees.length || DATA.duplication.largest_copies.length) ? duplicationSection(DATA.duplication) : ""}
    ${DATA.reach && DATA.reach.analyzed.files ? reachSection(DATA.reach) : ""}

    <div class="two">
      <section><h2>Where the slop is: by category</h2><div class="panel bars">${bars(
        Object.entries(score.by_category).map(([k, v]) => [k, v.weight, v.count]))}</div></section>
      <section><h2>Languages (LOC)</h2><div class="panel bars">${bars(
        Object.entries(meta.languages).map(([k, v]) => [k, v, fmt(v)]))}</div></section>
    </div>

    <div class="two">
      <section><h2>Hotspot files</h2>${hotspotTable(score.hotspot_files.slice(0, 15), "File")}</section>
      <section><h2>Hotspot modules</h2>${hotspotTable(score.hotspot_modules.slice(0, 15), "Module")}</section>
    </div>

    <h2>Findings</h2>
    <div class="filters">
      ${SEVERITIES.map((s) => `<button class="chip" data-sev="${s}" aria-pressed="true">${s} · ${score.by_severity[s]}</button>`).join("")}
      <select id="cat"><option value="">All categories</option>${Object.keys(score.by_category).map((c) =>
        `<option>${esc(c)}</option>`).join("")}</select>
      <input type="search" id="q" placeholder="Filter by path, rule or text">
      <span class="count muted" id="count"></span>
    </div>
    <div id="findings"></div>

    ${DATA.modules.length ? `<h2>Module health</h2><div class="panel table-wrap"><table>
      <thead><tr><th>Module</th><th>Health</th><th>Cohesion</th><th>Coupling</th><th>Summary</th></tr></thead>
      <tbody>${DATA.modules.map((m) => `<tr><td class="mono">${esc(m.module)}</td>
        <td><span class="pill ${esc(m.health)}">${esc(m.health)}</span></td>
        <td><span class="pill ${m.cohesion === "low" ? "low-c" : ""}">${esc(m.cohesion)}</span></td>
        <td><span class="pill ${m.coupling === "high" ? "low-c" : ""}">${esc(m.coupling)}</span></td>
        <td>${esc(m.summary)}</td></tr>`).join("")}</tbody></table></div>` : ""}

    ${DATA.dismissed.length ? `<h2>Dismissed</h2><details class="panel dismissed"><summary>${DATA.dismissed.length}
      findings the editors judged not worth fixing${DATA.appeals && DATA.appeals.restored ? ` (${DATA.appeals.restored} more were restored on appeal)` : ""}</summary><ul>${DATA.dismissed.map((d) =>
      `<li><strong>${esc(d.title)}</strong> <span class="mono muted">${esc(d.where)}</span><div class="muted">${esc(d.reason)}</div>
       ${d.appeal ? `<div class="muted">Appeal upheld: ${esc(d.appeal)}</div>` : ""}</li>`).join("")}
      </ul></details>` : ""}
    ${DATA.usage ? `<p class="muted footer">${fmt(DATA.usage.sessions)} codex sessions · ${fmt(DATA.usage.input_tokens)} input tokens
      (${fmt(DATA.usage.cached_input_tokens)} cached) · ${fmt(DATA.usage.output_tokens)} output tokens</p>` : ""}
  `;
  app.querySelectorAll("[data-jump]").forEach((link) => link.addEventListener("click", (e) => {
    e.preventDefault();
    const card = document.getElementById(link.dataset.jump);
    if (card) { card.open = true; card.scrollIntoView({ behavior: "smooth", block: "start" }); }
  }));

  const state = { sev: new Set(SEVERITIES), cat: "", q: "" };
  app.querySelectorAll("[data-sev]").forEach((chip) => chip.addEventListener("click", () => {
    const s = chip.dataset.sev;
    state.sev.has(s) ? state.sev.delete(s) : state.sev.add(s);
    chip.setAttribute("aria-pressed", state.sev.has(s));
    drawFindings(state);
  }));
  app.querySelector("#cat").addEventListener("change", (e) => { state.cat = e.target.value; drawFindings(state); });
  app.querySelector("#q").addEventListener("input", (e) => { state.q = e.target.value.toLowerCase(); drawFindings(state); });
  drawFindings(state);
}

function bars(rows) {
  if (!rows.length) return `<div class="empty">Nothing to show</div>`;
  const max = Math.max(...rows.map((r) => r[1])) || 1;
  return rows.map(([label, value, note]) => `<div class="bar-row"><span class="mono">${esc(label)}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${(value / max) * 100}%"></div></div>
    <span class="n">${esc(note)}</span></div>`).join("");
}

function historyLabel(h) {
  const maturity = h.maturity === "mature" ? "established" : h.maturity;
  if (maturity === "none") return "none (judged on structure alone)";
  if (h.total_commits === undefined) return `${maturity}, ${fmt(h.commits)} commits over ${fmt(h.span_days)} days`;
  return `${maturity}, ${fmt(h.total_commits)} commits since ${h.first_commit}; ${fmt(h.window_commits)} in the last ` +
    `${h.window_days} days touch the scanned files; ${fmt(h.hot_files || 0)} hot files` +
    (maturity === "young" ? " (co-change withheld: too young)" : "");
}

function fingerprintSection(fp) {
  const cols = fp.signals.filter((s) => s.key !== "todo_markers");
  const row = (name, r, flagged) => `<tr><td class="mono">${name}</td><td class="num">${fmt(r.loc)}</td>
    ${cols.map((c) => `<td class="num ${flagged.includes(c.key) ? "flag" : ""}">${r[c.key]}</td>`).join("")}
    <td class="num">${r.giant_files}</td></tr>`;
  return `<h2>Slop fingerprint</h2><div class="panel table-wrap">
    <p class="muted note">Counted by the script, not judged by the workers. Rates per 1k LOC (copied: % of non-test LOC);
      highlighted = at least twice the repository rate.</p><table>
    <thead><tr><th>Module</th><th class="num">LOC</th>${cols.map((c) => `<th class="num" title="${esc(c.description)}">${esc(c.label)}</th>`).join("")}
      <th class="num">files ≥3k LOC</th></tr></thead>
    <tbody>${row("<strong>whole repository</strong>", fp.repo, [])}
      ${fp.modules.slice(0, 15).map((m) => row(esc(m.module), m, m.flagged)).join("")}</tbody></table></div>`;
}

function duplicationSection(d) {
  const trees = d.parallel_trees.length ? `<div class="panel table-wrap"><p class="muted note">Sibling directories that look like
    two versions of one thing. Some are by design; "changed together" shows whether they are maintained in lockstep.</p><table>
    <thead><tr><th>Tree</th><th>Tree</th><th class="num">LOC</th><th class="num">Same-named files</th>
      <th class="num">Copied tokens</th><th class="num">Changed together</th></tr></thead>
    <tbody>${d.parallel_trees.slice(0, 10).map((t) => `<tr><td class="mono">${esc(t.a)}</td><td class="mono">${esc(t.b)}</td>
      <td class="num">${fmt(t.loc_a)} / ${fmt(t.loc_b)}</td><td class="num">${t.shared_names}</td><td class="num">${fmt(t.copied_tokens)}</td>
      <td class="num">${t.cochange ? `${t.cochange.both} commits (${Math.round(t.cochange.ratio * 100)}%)` : "n/a"}</td></tr>`).join("")}
    </tbody></table></div>` : "";
  const copies = d.largest_copies.length ? `<div class="panel table-wrap" style="margin-top:12px"><table>
    <thead><tr><th>Copied block</th><th>Same code at</th><th class="num">Tokens</th></tr></thead>
    <tbody>${d.largest_copies.slice(0, 12).map((p) => `<tr><td class="mono">${esc(where(p.a))}</td>
      <td class="mono">${esc(where(p.b))}</td><td class="num">${fmt(p.tokens)}</td></tr>`).join("")}</tbody></table></div>` : "";
  return `<h2>Duplication · ${fmt(d.total_pairs)} copied blocks</h2>${trees}${copies}`;
}

const REACH_LABELS = {
  launched: "launched by checked-in configuration or a framework",
  manual: "only from entry points nothing checked in starts",
  tests: "only by tests",
  none: "by nothing",
};

function reachSection(r) {
  const files = (g) => g.files.slice(0, 8).map((p) => `<span class="mono">${esc(p)}</span>`).join(", ") + (g.file_count > 8 ? " …" : "");
  const scripts = r.manual.filter((g) => g.file_count === 1 && g.files[0] === g.roots[0] && g.roots.length === 1);
  const groups = r.manual.filter((g) => !scripts.includes(g));
  const list = (title, rows, label) => rows.length ? `<p><strong>${title}</strong></p><ul>${rows.map((g) =>
    `<li>${label(g)} <span class="muted">(${fmt(g.loc)} LOC)</span><div class="muted">${files(g)}</div></li>`).join("")}</ul>` : "";
  return `<h2>Reachability</h2><div class="panel table-wrap">
    <p class="muted note">What checked-in configuration actually runs (containers, compose, CI, Procfiles, Makefiles,
      package.json, pyproject, shell scripts, framework conventions), followed through imports. Counted by the script for
      Python and JavaScript/TypeScript (${fmt(r.analyzed.loc)} non-test LOC), not judged by the workers. Dynamic loading the
      script can't see makes "by nothing" wrong, so treat it as a lead.</p>
    <table><thead><tr><th>Reached</th><th class="num">Files</th><th class="num">LOC</th></tr></thead>
    <tbody>${Object.entries(REACH_LABELS).map(([k, label]) => `<tr><td>${label}</td>
      <td class="num">${fmt(r.totals[k].files)}</td><td class="num">${fmt(r.totals[k].loc)}</td></tr>`).join("")}</tbody></table>
    <div class="note" style="padding-bottom: 12px">
      ${r.launchers.length ? `<p class="muted">Launched by: ${r.launchers.slice(0, 10).map((l) =>
        `<span class="mono">${esc(l.config)}</span> → <span class="mono">${esc(l.path)}</span> (${esc(l.how)})`).join("; ")}${
        r.launchers.length > 10 ? `; and ${r.launchers.length - 10} more` : ""}.</p>` : ""}
      ${list("Reachable only from entry points nothing checked in starts", groups,
        (g) => `${g.roots.map((p) => `<span class="mono">${esc(p)}</span>`).join(", ")} reach ${fmt(g.file_count)} files`)}
      ${scripts.length ? `<p><strong>${scripts.length} standalone scripts</strong> nothing checked in starts
        <span class="muted">(${fmt(scripts.reduce((n, g) => n + g.loc, 0))} LOC)</span></p>` : ""}
      ${list("Used only by tests", r.tests_only, (g) => `<span class="mono">${esc(g.module)}</span>`)}
      ${list("Reached by nothing", r.unreached, (g) => `<span class="mono">${esc(g.module)}</span>`)}
    </div></div>`;
}

function hotspotTable(rows, label) {
  if (!rows.length) return `<div class="panel empty">No findings</div>`;
  const usedBy = rows.some((r) => "fan_in" in r);
  return `<div class="panel table-wrap"><table><thead><tr><th>${label}</th><th class="num">Weight</th><th class="num">LOC</th>
    ${usedBy ? `<th class="num" title="files that import it">Used by</th>` : ""}
    <th class="num" title="commits touching it">Commits</th><th class="num" title="weight per 1k LOC">Density</th></tr></thead>
    <tbody>${rows.map((r) =>
    `<tr><td class="mono">${esc(r.name)}</td><td class="num">${r.weight}</td><td class="num">${fmt(r.loc)}</td>
     ${usedBy ? `<td class="num">${fmt(r.fan_in)}</td>` : ""}
     <td class="num">${fmt(r.commits)}</td><td class="num">${r.density}</td></tr>`).join("")}</tbody></table></div>`;
}

function drawFindings(state) {
  const shown = DATA.findings.filter((f) =>
    state.sev.has(f.severity) && (!state.cat || f.category === state.cat) &&
    (!state.q || [f.title, f.rule, f.evidence, ...f.locations.map((l) => l.path)].join(" ").toLowerCase().includes(state.q)));
  document.getElementById("count").textContent = `${shown.length} of ${DATA.findings.length}`;
  document.getElementById("findings").innerHTML = shown.length ? shown.map(findingCard).join("")
    : `<div class="panel empty">No findings match these filters.</div>`;
}

function findingCard(f) {
  const r = f.review, a = f.appeal || {};
  const status = a.action === "overturn" ? (r && r.action === "drop" ? "restored on appeal" : `re-rated on appeal`)
    : !r ? "unreviewed" : r.action === "rerate" ? `re-rated from ${f.original_severity}` : "reviewed";
  return `<details class="panel finding" id="${esc(f.id)}" style="--c: var(--${f.severity})">
    <summary>
      <span class="title">${esc(f.title)}</span>
      <span class="meta"><span class="sev">${f.severity}</span><span class="mono">${esc(where(f.locations[0]))}</span>
        <span>${esc(f.category)}/${esc(f.rule)}</span><span>confidence ${esc(f.confidence)}</span>
        <span>effort ${esc(f.effort)}</span><span>${status}</span></span>
    </summary>
    <div class="body">
      <p><b>Evidence</b> ${esc(f.evidence)}</p>
      <p><b>Impact</b> ${esc(f.impact)}</p>
      <p><b>Fix</b> ${esc(f.recommendation)}</p>
      ${f.locations.length > 1 ? `<p><b>Also at</b> <span class="mono">${f.locations.slice(1).map((l) => esc(where(l))).join(", ")}</span></p>` : ""}
      ${r ? `<p><b>Editor</b> ${esc(r.rationale)}</p>` : ""}
      ${a.rationale ? `<p><b>Appeal</b> ${esc(a.rationale)}</p>` : ""}
      <p class="muted mono">${esc(f.id)} · from ${esc(f.sources.join(", "))}</p>
    </div>
  </details>`;
}

render();
</script>
</body>
</html>
